name: Build VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin-arm64
          - darwin-x64
          - linux-arm64
          - linux-x64
          - win32-arm64
          - win32-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: agent-teams-mcp-vscode-*-${{ matrix.target }}.vsix
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: release-assets
          merge-multiple: true
      - name: Create draft with all six VSIXs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*.vsix)
          if [[ ${#assets[@]} -ne 6 ]]; then
            echo "::error::Expected exactly six VSIXs; found ${#assets[@]}."
            exit 1
          fi
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            if [[ ! -s "release-assets/agent-teams-mcp-vscode-${TAG#v}-${target}.vsix" ]]; then
              echo "::error::Missing VSIX for ${target} matching tag ${TAG}. Use v<version> from package.json."
              exit 1
            fi
          done
          gh release create --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes -- "$TAG" "${assets[@]}"
